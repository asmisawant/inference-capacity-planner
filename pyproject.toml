[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capacity-planner"
version = "0.1.0"
description = "GPU serving capacity planner: roofline predictions validated against real vLLM/SGLang benchmarks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
capacity-planner = "capacity_planner.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capacity_planner = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
